<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso - Sistema CAOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background: linear-gradient(135deg, #0d1b5e 0%, #1e3a8a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: 100%; max-width: 420px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .flag-bar { height: 5px; background: linear-gradient(to right, #FFCC00 33%, #0033A0 33%, #0033A0 66%, #EF3340 66%); border-radius: 20px 20px 0 0; }
  </style>
</head>
<body>

<div class="card login-card">
  <div class="flag-bar"></div>
  <div class="card-body p-4">
    <h4 class="mb-3 text-center">🇻🇪 Servicio de Apostilla</h4>

    <form id="loginForm" onsubmit="SEGURIDAD_CAOP_iniciarSesion(event)">
      <div class="mb-3">
        <label class="form-label">Seleccione Usuario</label>
        <select class="form-select" id="tipoUsuario" required>
          <option value="" disabled selected>Elija una opción...</option>
          <option value="Observatorio">Observatorio</option>
          <option value="Observatorio1">Observatorio 1 (Auxiliar)</option>
          <option value="CNC (Validador)">CNC (Validador)</option>
          <option value="OPT CUA">OPT CUA</option>
          <option value="OPT CARMELITAS">OPT CARMELITAS</option>
          <option value="OPT CHACAO">OPT CHACAO</option>
          <option value="OPT GALERIAS">OPT GALERIAS</option>
        </select>
      </div>

      <!-- CAMPO DE CORREO OBLIGATORIO -->
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" required placeholder="tucorreo@dominio.com">
      </div>

      <div class="mb-3">
        <label class="form-label">Clave (4 dígitos)</label>
        <input type="password" class="form-control" id="clave" maxlength="4" pattern="\d{4}" required placeholder="****" inputmode="numeric">
      </div>

      <button type="submit" class="btn btn-primary w-100" id="btnLogin">Ingresar</button>

      <div class="text-center mt-3">
        <a href="#" onclick="SEGURIDAD_CAOP_olvideClave(event)" class="small">¿Olvidaste tu clave?</a>
      </div>
    </form>

    <div id="mensajeError" class="text-danger mt-2 small text-center"></div>
  </div>
</div>

<script>
// 🛡️ BLOQUE SEGURIDAD_CAOP (Frontend V1.0)
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx7aDFr2lTIQcLgwyOqGODXQQFzsJhivdL02huOwvX4iC1zSsEGts75QL3rED3BcR3zhw/exec";

function SEGURIDAD_CAOP_iniciarSesion(event) {
  event.preventDefault();
  const usuario = document.getElementById('tipoUsuario').value;
  const correo  = document.getElementById('correo').value.trim();
  const clave   = document.getElementById('clave').value.trim();
  const btn     = document.getElementById('btnLogin');
  const errorDiv= document.getElementById('mensajeError');

  btn.innerText = "Verificando..."; btn.disabled = true; errorDiv.innerText = "";

  fetch(URL_APPS_SCRIPT, {
    method: 'POST',
    body: JSON.stringify({ accion: 'login', usuario, clave, correo }),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  })
  .then(r => r.json())
  .then(resp => {
    if (!resp.exito) {
      errorDiv.innerText = resp.mensaje;
      btn.innerText = "Ingresar"; btn.disabled = false;
      return;
    }
    if (resp.requiereCambio) {
      SEGURIDAD_CAOP_pedirCambioClave(usuario, correo, resp.rol);
    } else {
      SEGURIDAD_CAOP_redirigir(resp.rol, usuario, correo);
    }
  })
  .catch(() => {
    errorDiv.innerText = "Error de conexión. Verifique su Apps Script.";
    btn.innerText = "Ingresar"; btn.disabled = false;
  });
}

function SEGURIDAD_CAOP_pedirCambioClave(usuario, correo, rol) {
  Swal.fire({
    title: '🔐 Crea tu clave',
    text: 'Es tu primer ingreso. Debes crear una clave nueva de 4 dígitos (no puede ser 1234).',
    input: 'password',
    inputLabel: 'Nueva clave (4 dígitos)',
    inputAttributes: { maxlength: 4, pattern: '\\d{4}', inputmode: 'numeric' },
    inputValidator: (v) => {
      if (!v || v.length !== 4 || !/^\d+$/.test(v)) return 'Debe ser de 4 dígitos numéricos.';
      if (v === '1234') return 'No puedes usar la clave inicial.';
    },
    allowOutsideClick: false,
    allowEscapeKey: false,
    confirmButtonText: 'Guardar y Entrar',
    confirmButtonColor: '#0d1b5e'
  }).then(res => {
    if (!res.isConfirmed) return;
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'actualizarClave', usuario, nuevaClave: res.value, correo }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(r => r.json())
    .then(r2 => {
      if (r2.exito) {
        Swal.fire('¡Listo!', 'Clave creada. Entrando...', 'success').then(() => SEGURIDAD_CAOP_redirigir(rol, usuario, correo));
      } else {
        Swal.fire('Error', r2.mensaje, 'error');
      }
    });
  });
}

function SEGURIDAD_CAOP_olvideClave(event) {
  event.preventDefault();
  Swal.fire({
    title: '📧 Recuperar clave',
    text: 'Escribe el correo con el que te registraste.',
    input: 'email',
    inputLabel: 'Correo electrónico',
    inputValidator: (v) => (!v || !v.includes('@')) ? 'Correo inválido.' : null,
    showCancelButton: true,
    confirmButtonText: 'Enviar',
    confirmButtonColor: '#0d1b5e'
  }).then(res => {
    if (!res.isConfirmed) return;
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'recuperarClave', correo: res.value }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(r => r.json())
    .then(r2 => Swal.fire(r2.exito ? '¡Enviado!' : 'Error', r2.mensaje, r2.exito ? 'success' : 'error'));
  });
}

function SEGURIDAD_CAOP_redirigir(rol, usuario, correo) {
  const u = usuario.trim();
  sessionStorage.setItem('usuario', u);
  sessionStorage.setItem('usuarioLogueado', u);
  sessionStorage.setItem('rol', rol.trim());
  sessionStorage.setItem('correo', correo.trim());

  if (u === 'Observatorio' || u === 'Observatorio1') window.location.href = 'observatorio.html';
  else if (u.startsWith('CNC')) window.location.href = 'cnc.html';
  else window.location.href = 'formulario.html';
}
</script>
</body>
</html>
