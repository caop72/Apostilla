<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apostilla - Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #0d1b5e 0%, #1e3a8a 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .flag-bar { height: 5px; background: linear-gradient(to right, #FFCC00 33%, #0033A0 33%, #0033A0 66%, #EF3340 66%); border-radius: 20px 20px 0 0; }
  </style>
</head>
<body>

<div class="card login-card">
  <div class="flag-bar"></div>
  <div class="card-body p-4 text-center">
    <h4 class="mb-3">🇻🇪 Servicio de Apostilla</h4>
    
<form id="loginForm" onsubmit="iniciarSesion(event)">
  <div class="mb-3 text-start">
    <label class="form-label">Seleccione Usuario</label>
    <select class="form-select" id="tipoUsuario" required>
      <option value="" disabled selected>Elija una opción...</option>
      <option value="Observatorio">Observatorio</option>
      <option value="Observatorio1">Observatorio 1 (Auxiliar)</option>
      <option value="CNC">CNC (Validador)</option>
      <option value="OPT CUA">OPT CUA</option>
      <option value="OPT CARMELITAS">OPT CARMELITAS</option>
      <option value="OPT CHACAO">OPT CHACAO</option>
      <option value="OPT GALERIAS">OPT GALERIAS</option>
    </select>
  </div>
      
      <div class="mb-4 text-start">
        <label class="form-label">Clave (4 dígitos)</label>
        <input type="password" class="form-control" id="clave" maxlength="4" pattern="\d{4}" required placeholder="****">
      </div>
      
      <button type="submit" class="btn btn-primary w-100" id="btnLogin">Ingresar</button>
    </form>

    <div id="mensajeError" class="text-danger mt-2 small"></div>
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx7aDFr2lTIQcLgwyOqGODXQQFzsJhivdL02huOwvX4iC1zSsEGts75QL3rED3BcR3zhw/exec";

  function iniciarSesion(event) {
    event.preventDefault();
    const usuario = document.getElementById('tipoUsuario').value;
    const clave = document.getElementById('clave').value;
    const btn = document.getElementById('btnLogin');
    const errorDiv = document.getElementById('mensajeError');
    
    btn.innerText = "Verificando...";
    btn.disabled = true;
    errorDiv.innerText = "";

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'login', usuario: usuario, clave: clave }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(response => response.json())
    .then(resp => {
      if (resp.exito) {
        // Guardamos el nombre exacto del usuario en lugar del rol
        sessionStorage.setItem('usuarioLogueado', usuario); 
        
        // 🚀 REDIRECCIÓN INTELIGENTE POR NOMBRE DE USUARIO
        if (usuario === 'Observatorio' || usuario === 'Observatorio1') {
          window.location.href = 'observatorio.html';
        } else if (usuario === 'CNC') {
          window.location.href = 'cnc.html';
        } else {
          window.location.href = 'formulario.html';
        }
      } else {
        errorDiv.innerText = resp.mensaje;
        btn.innerText = "Ingresar";
        btn.disabled = false;
      }
    })
    .catch(error => {
      console.error(error);
      errorDiv.innerText = "Error de conexión. Verifique la URL del script.";
      btn.innerText = "Ingresar";
      btn.disabled = false;
    });
  }
</script>
</body>
</html>
