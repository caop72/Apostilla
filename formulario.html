<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario OPT - Apostilla</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f4f6f9; padding-top: 40px; }
    .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .card-header { background-color: #0d1b5e; color: white; border-radius: 15px 15px 0 0 !important; text-align: center;}
    .btn-primary { background-color: #0d1b5e; border: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      
      <div class="card">
        <div class="card-header">
          <h4>🇻🇪 App Apostilla</h4>
          <p class="mb-0" id="nombreOPT">Cargando...</p>
          <button class="btn btn-sm btn-outline-light mt-2" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
        <div class="card-body">
          
          <form id="formApostilla" onsubmit="enviarFormulario(event)">
            
            <div class="mb-3">
              <label class="form-label">Confirmar Nombre de la OPT</label>
              <input type="text" class="form-control" name="nombreOPT" id="inputNombreOPT" required readonly>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Citas Atendidas</label>
                <input type="number" class="form-control" name="citas" required min="0">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Documentos Totales</label>
                <input type="number" class="form-control" name="docsTotal" required min="0">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-danger">Rechazados</label>
                <input type="number" class="form-control" name="rechazados" required min="0">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-success">Validados</label>
                <input type="number" class="form-control" name="validados" required min="0">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Ingreso Total (Bs)</label>
              <input type="number" step="0.01" class="form-control" name="montoBs" required placeholder="Ej: 1500.50">
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg" id="btnGuardar">Guardar Datos</button>
            </div>
          </form>

          <div id="mensaje" class="mt-3 text-center"></div>
          
        </div>
      </div>
      
    </div>
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx7aDFr2lTIQcLgwyOqGODXQQFzsJhivdL02huOwvX4iC1zSsEGts75QL3rED3BcR3zhw/exec";
  
  // Validar sesión y cargar nombre de la OPT
  window.onload = function() {
    const usuario = sessionStorage.getItem('usuarioLogueado');
    if (!usuario || usuario === 'CNC' || usuario === 'Observatorio') {
      window.location.href = 'index.html';
    } else {
      // Asignar un nombre legible según el usuario
      const nombres = { 'OPT1': 'OPT 1 - Caracas', 'OPT2': 'OPT 2 - Miranda', 'OPT3': 'OPT 3 - Zulia' };
      const nombre = nombres[usuario] || usuario;
      document.getElementById('nombreOPT').innerText = "Registrando datos para: " + nombre;
      document.getElementById('inputNombreOPT').value = nombre;
    }
  }

  function cerrarSesion() {
    sessionStorage.clear();
    window.location.href = 'index.html';
  }

  function enviarFormulario(event) {
    event.preventDefault();
    const form = event.target;
    const formObject = Object.fromEntries(new FormData(form).entries());
    
    const btn = document.getElementById('btnGuardar');
    btn.innerText = "Enviando...";
    btn.disabled = true;

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'enviarDatos', datos: formObject }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(response => response.json())
    .then(resp => {
      if (resp.exito) {
        Swal.fire({
          title: '¡Éxito!',
          text: resp.mensaje,
          icon: 'success',
          confirmButtonColor: '#0d1b5e'
        });
        form.reset();
        document.getElementById('inputNombreOPT').value = formObject.nombreOPT; // Mantener nombre
      } else {
        Swal.fire('Error', resp.mensaje, 'error');
      }
      btn.innerText = "Guardar Datos";
      btn.disabled = false;
    })
    .catch(error => {
      console.error(error);
      Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
      btn.innerText = "Guardar Datos";
      btn.disabled = false;
    });
  }
</script>
</body>
</html>
