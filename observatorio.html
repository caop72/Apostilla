<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatorio - Apostilla</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f8f9fa; }
    .navbar { background-color: #0d1b5e; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: none; margin-bottom: 15px;}
    .card-header { background-color: #fff; border-bottom: 2px solid #0d1b5e; font-weight: bold; color: #0d1b5e; }
    .ai-box { background: #eef2ff; border-left: 5px solid #4f46e5; padding: 15px; border-radius: 10px; }
    
    /* Ajustes móviles para gráficos y textos */
    .chart-container { position: relative; height: 50vw; max-height: 300px; width: 100%; }
    @media (max-width: 768px) {
      h2 { font-size: 1.3rem; }
      .card-body { padding: 12px; }
      .chart-container { height: 70vw; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h5">📈 Observatorio</span>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-light btn-sm" onclick="abrirConfiguracion()">⚙️ Configuración</button>
      <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>
</nav>

<div class="container">
  <!-- Tarjetas Resumen -->
  <div class="row g-2 mb-3">
    <div class="col-6 col-md-3">
      <div class="card p-2 text-center">
        <small class="text-muted fw-bold">Citas</small>
        <h4 class="text-primary mb-0" id="totalCitas">0</h4>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-2 text-center">
        <small class="text-muted fw-bold">Validados</small>
        <h4 class="text-success mb-0" id="totalValidados">0</h4>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-2 text-center">
        <small class="text-muted fw-bold">Rechazo</small>
        <h4 class="text-danger mb-0" id="tasaRechazo">0%</h4>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card p-2 text-center">
        <small class="text-muted fw-bold">Ingresos (Bs)</small>
        <h4 class="text-dark mb-0" id="totalIngresos">0</h4>
      </div>
    </div>
  </div>

  <!-- Gráficos -->
  <div class="row g-3 mb-3">
    <div class="col-md-8">
      <div class="card h-100">
        <div class="card-header py-2">📊 Citas vs Validados por OPT</div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="graficoBarras"></canvas>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card h-100">
        <div class="card-header py-2">🍩 Estados</div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="graficoDona"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Módulo de IA -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-header py-2">🤖 Centro de Inteligencia</div>
        <div class="card-body">
          <div class="ai-box mb-3" id="textoIA">
            <p class="mb-0 text-muted small">Copia los datos y pégalos en el chat de la IA para obtener un análisis.</p>
          </div>
          <div class="d-grid gap-2 d-md-flex justify-content-md-end">
            <button class="btn btn-primary btn-sm" onclick="copiarDatosParaIA()">📋 Copiar Datos</button>
            <button class="btn btn-success btn-sm" onclick="generarReporte()">🚀 Generar PDF y Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx7aDFr2lTIQcLgwyOqGODXQQFzsJhivdL02huOwvX4iC1zSsEGts75QL3rED3BcR3zhw/exec";
  
  if (sessionStorage.getItem('usuarioLogueado') !== 'Observatorio') window.location.href = 'index.html';
  function cerrarSesion() { sessionStorage.clear(); window.location.href = 'index.html'; }

  let datosGlobales = [];

  window.onload = function() { cargarDatosObservatorio(); }

  function cargarDatosObservatorio() {
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'obtenerDatosObservatorio' }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(resp => {
      if (resp.exito) {
        datosGlobales = resp.registros;
        document.getElementById('totalCitas').innerText = resp.totales.citas;
        document.getElementById('totalValidados').innerText = resp.totales.validados;
        document.getElementById('tasaRechazo').innerText = resp.totales.tasaRechazo + "%";
        document.getElementById('totalIngresos').innerText = resp.totales.ingresos.toLocaleString('es-VE', {maximumFractionDigits: 0});
        dibujarGraficos(resp.graficos);
      }
    });
  }

  function dibujarGraficos(datos) {
    new Chart(document.getElementById('graficoBarras').getContext('2d'), {
      type: 'bar',
      data: {
        labels: datos.opts,
        datasets: [
          { label: 'Citas', data: datos.citasPorOpt, backgroundColor: '#0d1b5e' },
          { label: 'Validados', data: datos.validadosPorOpt, backgroundColor: '#198754' }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });

    new Chart(document.getElementById('graficoDona').getContext('2d'), {
      type: 'doughnut',
      data: {
        labels: ['Validados', 'Pendientes', 'Devueltos'],
        datasets: [{ data: [datos.estados.validados, datos.estados.pendientes, datos.estados.devueltos], backgroundColor: ['#198754', '#ffc107', '#dc3545'] }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
  }

  function copiarDatosParaIA() {
    if (datosGlobales.length === 0) return alert("No hay datos cargados.");
    let texto = "DATOS HISTÓRICOS APOSTILLA:\nFecha | OPT | Citas | Docs | Val | Rech | Monto | Estado\n";
    datosGlobales.forEach(d => { texto += `${d.fecha} | ${d.opt} | ${d.citas} | ${d.docs} | ${d.validados} | ${d.rechazados} | ${d.monto} | ${d.estado}\n`; });
    navigator.clipboard.writeText(texto).then(() => {
      document.getElementById('textoIA').innerHTML = `<h6 class="text-success mb-1">✅ ¡Datos copiados!</h6><p class="mb-0 small">Pégalos en el chat de la IA y pide un análisis ejecutivo.</p>`;
    });
  }

  function generarReporte() {
    Swal.fire({ title: 'Generando...', text: 'Espere unos segundos.', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'generarReporte' }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(resp => {
      if (resp.exito) Swal.fire('¡Éxito!', 'El PDF ha sido enviado.', 'success');
      else Swal.fire('Error', resp.mensaje, 'error');
    });
  }
    // ==========================================
  // ⚙️ ADMINISTRACIÓN DE CONFIGURACIÓN
  // ==========================================
  function abrirConfiguracion() {
    Swal.fire({
      title: 'Cargando configuración...',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });
    
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'obtenerConfiguracion' }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(resp => {
      if (!resp.exito) {
        Swal.fire('Error', resp.mensaje, 'error');
        return;
      }
      mostrarModalConfiguracion(resp.config);
    })
    .catch(() => Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error'));
  }

  function mostrarModalConfiguracion(config) {
    // Construimos el HTML del formulario dinámicamente
    let htmlForm = '<div style="text-align:left; max-height: 60vh; overflow-y: auto; padding: 5px;">';
    
    config.forEach(item => {
      const esCorreo = item.clave.includes('CORREO');
      const esNumero = item.clave === 'TASA_CAMBIO' || item.clave === 'UMBRAL_RECHAZO';
      const icono = esCorreo ? '📧' : (esNumero ? '🔢' : '📝');
      
      htmlForm += `
        <div class="mb-3">
          <label class="form-label small fw-bold mb-1">${icono} ${item.clave}</label>
          <input 
            type="${esNumero ? 'number' : 'text'}" 
            step="${esNumero ? '0.01' : 'any'}"
            class="form-control form-control-sm" 
            id="cfg_${item.clave}" 
            value="${item.valor}"
          >
          <small class="text-muted" style="font-size: 0.75rem;">${item.descripcion}</small>
        </div>
      `;
    });
    
    htmlForm += '</div>';
    htmlForm += '<p class="text-muted small mt-2 mb-0">💡 Para múltiples correos, sepáralos con coma: <code>correo1@x.com, correo2@x.com</code></p>';
    
    Swal.fire({
      title: '⚙️ Configuración del Sistema',
      html: htmlForm,
      width: '600px',
      showCancelButton: true,
      confirmButtonText: '💾 Guardar cambios',
      cancelButtonText: 'Cancelar',
      confirmButtonColor: '#0d1b5e',
      preConfirm: () => {
        // Recopilamos todos los valores
        const cambios = [];
        config.forEach(item => {
          const nuevoValor = document.getElementById(`cfg_${item.clave}`).value.trim();
          if (nuevoValor !== String(item.valor)) {
            cambios.push({ clave: item.clave, valor: nuevoValor });
          }
        });
        return cambios;
      }
    }).then((result) => {
      if (result.isConfirmed) {
        if (result.value.length === 0) {
          Swal.fire('Sin cambios', 'No modificaste ningún valor.', 'info');
          return;
        }
        guardarConfiguracion(result.value);
      }
    });
  }

  function guardarConfiguracion(cambios) {
    Swal.fire({
      title: 'Guardando...',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });
    
    // Enviamos los cambios uno por uno (secuencial) para detectar errores
    let promesas = cambios.map(cambio => {
      return fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({ 
          accion: 'actualizarConfiguracion', 
          clave: cambio.clave, 
          valor: cambio.valor 
        }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      }).then(res => res.json());
    });
    
    Promise.all(promesas)
      .then(resultados => {
        const errores = resultados.filter(r => !r.exito);
        if (errores.length > 0) {
          Swal.fire('Error parcial', errores.map(e => e.mensaje).join('<br>'), 'error');
        } else {
          Swal.fire({
            title: '¡Guardado!',
            html: `✅ <b>${cambios.length}</b> valor(es) actualizado(s) correctamente.`,
            icon: 'success',
            timer: 2500,
            showConfirmButton: false
          });
        }
      })
      .catch(() => Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error'));
  }
</script>
</body>
</html>
