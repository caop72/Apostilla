<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatorio - Apostilla</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f8f9fa; }
    .navbar { background-color: #0d1b5e; }
    .card { border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: none; margin-bottom: 15px;}
    .card-header { background-color: #fff; border-bottom: 2px solid #0d1b5e; font-weight: bold; color: #0d1b5e; }
    .tabla-seguimiento { font-size: 0.85rem; }
    .tabla-seguimiento th { position: sticky; top: 0; background: #f1f3f5; z-index: 1; }
    .badge-estado { font-size: 0.75rem; padding: 4px 8px; }
    .fila-pendiente { background-color: #fff9e6 !important; }
    .fila-devuelto { background-color: #ffe6e6 !important; }
    .fila-validado { background-color: #e6f7ee !important; }
    
    /* ESTA CLASE ES LA QUE OCULTA TODO PARA EL AUXILIAR */
    .modo-auxiliar .ocultar-auxiliar { display: none !important; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h5">📈 Observatorio - <span id="nombreUsuario">Cargando...</span></span>
    <div class="d-flex gap-2">
      <!-- Botón de Configuración (Oculto para auxiliar) -->
      <button class="btn btn-outline-light btn-sm ocultar-auxiliar" onclick="abrirConfiguracion()">⚙️ Config</button>
      <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Salir</button>
    </div>
  </div>
</nav>

<div class="container-fluid px-3">
  
  <!-- 🔍 FILTROS (Ocultos para auxiliar) -->
  <div class="card mb-3 ocultar-auxiliar">
    <div class="card-header py-2">🔍 Filtros de Búsqueda</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-6 col-md-3">
          <label class="form-label small fw-bold mb-1">Desde</label>
          <input type="date" class="form-control form-control-sm" id="filtroDesde">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label small fw-bold mb-1">Hasta</label>
          <input type="date" class="form-control form-control-sm" id="filtroHasta">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small fw-bold mb-1">OPT</label>
          <select class="form-select form-select-sm" id="filtroOPT">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small fw-bold mb-1">Estado</label>
          <select class="form-select form-select-sm" id="filtroEstado">
            <option value="">Todos</option>
            <option value="Validado">🟢 Validado</option>
            <option value="Pendiente">🟡 Pendiente</option>
            <option value="Devuelto">🔴 Devuelto</option>
          </select>
        </div>
        <div class="col-12 col-md-2 d-flex align-items-end gap-2">
          <button class="btn btn-primary btn-sm flex-fill" onclick="aplicarFiltros()">Aplicar</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="limpiarFiltros()">Limpiar</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- 📊 TARJETAS RESUMEN (Ocultas para auxiliar) -->
  <div class="row g-2 mb-3 ocultar-auxiliar">
    <!-- ... (Tus tarjetas de resumen van aquí, se ocultarán para el auxiliar) ... -->
    <div class="col-12"><p class="text-muted text-center py-3">Tarjetas ocultas en modo Auxiliar</p></div>
  </div>
  
  <!-- 📈 GRÁFICOS (Ocultos para auxiliar) -->
  <div class="row g-3 mb-3 ocultar-auxiliar">
    <!-- ... (Tus gráficos van aquí, se ocultarán para el auxiliar) ... -->
  </div>
  
  <!-- 📋 TABLA DE SEGUIMIENTO TOTAL (Visible SIEMPRE) -->
  <div class="card mb-3">
    <div class="card-header py-2 d-flex justify-content-between align-items-center">
      <span>📋 Seguimiento Total de Reportes</span>
      <span class="badge bg-secondary" id="countTabla">0 registros</span>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
        <table class="table table-sm table-hover tabla-seguimiento mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha Envío</th>
              <th>OPT</th>
              <th>Citas</th>
              <th>Docs</th>
              <th>Val.</th>
              <th>Rech.</th>
              <th>Monto Bs</th>
              <th>Estado</th>
              <th>Validado Por</th>
              <th>Fecha Validación</th>
              <th>T. Resp.</th>
              <th>Comentario CNC</th>
            </tr>
          </thead>
          <tbody id="tablaSeguimiento">
            <tr><td colspan="13" class="text-center text-muted py-3">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <!-- 🎯 ACCIONES (Ocultas para auxiliar) -->
  <div class="row mb-4 ocultar-auxiliar">
    <!-- ... (Botones de análisis y generación de PDF) ... -->
  </div>
</div>

<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbx7aDFr2lTIQcLgwyOqGODXQQFzsJhivdL02huOwvX4iC1zSsEGts75QL3rED3BcR3zhw/exec";
  
  const usuarioLogueado = sessionStorage.getItem('usuarioLogueado');
  if (!usuarioLogueado || !usuarioLogueado.includes('Observatorio')) {
    window.location.href = 'index.html';
  }
  
  document.getElementById('nombreUsuario').innerText = usuarioLogueado;

  // 🚀 AQUI APLICAMOS EL MODO LIMPIO
if (usuarioLogueado === 'Observatorio1')
    document.body.classList.add('modo-auxiliar'); // Oculta filtros, tarjetas, gráficos y botones de config
  }
  
  let datosFiltradosActuales = [];
  let graficoBarrasInst = null;
  let graficoDonaInst = null;
  
  window.onload = function() {
    // Solo cargamos los filtros si NO es auxiliar
    if (!document.body.classList.contains('modo-auxiliar')) {
      cargarListaOPTs();
    }
    aplicarFiltros();
  };
  
  function cerrarSesion() { sessionStorage.clear(); window.location.href = 'index.html'; }
  
  function cargarListaOPTs() {
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'obtenerListaOPTs' }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(resp => {
      if (resp.exito) {
        const select = document.getElementById('filtroOPT');
        resp.opts.forEach(opt => {
          const opt_el = document.createElement('option');
          opt_el.value = opt;
          opt_el.textContent = opt;
          select.appendChild(opt_el);
        });
      }
    });
  }
  
  function obtenerFiltros() {
    // Si es auxiliar, no aplicamos filtros (petición vacía para traer todo)
    if (document.body.classList.contains('modo-auxiliar')) return {};
    
    return {
      opt: document.getElementById('filtroOPT').value,
      estado: document.getElementById('filtroEstado').value,
      fechaDesde: document.getElementById('filtroDesde').value,
      fechaHasta: document.getElementById('filtroHasta').value
    };
  }
  
  function aplicarFiltros() {
    const filtros = obtenerFiltros();
    
    // Cargar la tabla (SIEMPRE)
    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      body: JSON.stringify({ accion: 'obtenerSeguimiento', filtros: filtros }),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(resp => {
      if (resp.exito) {
        datosFiltradosActuales = resp.registros;
        renderizarTabla(resp.registros);
      }
    });
    
    // Cargar estadísticas (SOLO si no es auxiliar)
    if (!document.body.classList.contains('modo-auxiliar')) {
      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({ accion: 'obtenerEstadisticas', filtros: filtros }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
      .then(res => res.json())
      .then(resp => {
        if (resp.exito) renderizarEstadisticas(resp);
      });
    }
  }
  
  function renderizarTabla(registros) {
    const tbody = document.getElementById('tablaSeguimiento');
    document.getElementById('countTabla').innerText = registros.length + ' registros';
    
    if (registros.length === 0) {
      tbody.innerHTML = '<tr><td colspan="13" class="text-center text-muted py-3">No hay registros.</td></tr>';
      return;
    }
    
    let html = '';
    registros.forEach(r => {
      let badgeClass = 'bg-secondary';
      let filaClass = '';
      if (r.estado === 'Validado') { badgeClass = 'bg-success'; filaClass = 'fila-validado'; }
      else if (r.estado === 'Pendiente') { badgeClass = 'bg-warning text-dark'; filaClass = 'fila-pendiente'; }
      else if (r.estado === 'Devuelto') { badgeClass = 'bg-danger'; filaClass = 'fila-devuelto'; }
      
      html += `
        <tr class="${filaClass}">
          <td><small>${r.id}</small></td>
          <td><small>${r.fechaEnvio}</small></td>
          <td><strong>${r.opt}</strong></td>
          <td>${r.citas}</td>
          <td>${r.docs}</td>
          <td class="text-success">${r.validados}</td>
          <td class="text-danger">${r.rechazados}</td>
          <td>${r.montoBs.toLocaleString('es-VE', {minimumFractionDigits: 2})}</td>
          <td><span class="badge ${badgeClass} badge-estado">${r.estado}</span></td>
          <td><small>${r.validadoPor || '-'}</small></td>
          <td><small>${r.fechaValidacion || '-'}</small></td>
          <td><small>${r.tiempoRespuestaHoras ? r.tiempoRespuestaHoras + 'h' : '-'}</small></td>
          <td><small>${r.comentarioCNC || '-'}</small></td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }
  
  // ... (El resto de tus funciones: renderizarEstadisticas, copiarDatosParaIA, generarReporte, etc. se mantienen igual)
  // Si necesitas que te pegue el archivo completo con todas las funciones, dímelo, pero esta estructura es la que hace la magia.
</script>

</body>
</html>
